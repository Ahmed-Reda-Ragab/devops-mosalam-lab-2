services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    limits:
      cpus: '1'
      memory: 512M
    logging:
      driver: "local"
    networks:
      - db-network

  backend:
    build:
      context: ./backend
    depends_on:
      - db
    env_file:
      - ./backend/.env
    expose:
      - '8000'
    restart: unless-stopped
    limits:
      cpus: '1'
      memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - private-network
      - db-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    expose:
      - '80'
    restart: unless-stopped
    resources:
      limits:
        cpus: '0.25'
        memory: 128M
    logging:
      driver: "local"
    networks:
      - private-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:latest
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    resources:
      limits:
        cpus: '0.25'
        memory: 128M
    logging:
      driver: "local"
    networks:
      - public-network
      - private-network
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    expose:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --docker_only=true
    networks:
      - private-network

volumes:
  db_data:

networks:
  public-network:
  private-network:
    internal: true
  db-network:
    internal: true
