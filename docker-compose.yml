services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - mysql_root_password
      - db_password
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Read the root password from the mounted secret instead of hardcoding it.
      # $$ escapes compose interpolation so the container's shell does the expansion.
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$(cat /run/secrets/mysql_root_password)" --silent
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512M
    cpus: 1
    logging:
      driver: "local"
    networks:
      - db-network

  backend:
    build:
      context: ./backend
    depends_on:
      - db
      - memcached
    env_file:
      - ./.env
    environment:
      CACHE_BACKEND: memcached
      CACHE_HOST: memcached
      CACHE_PORT: 11211
      CACHE_TTL_SECONDS: 60
    secrets:
      - db_password
    expose:
      - '8000'
    restart: unless-stopped
    mem_limit: 512M
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - private-network
      - db-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    expose:
      - '80'
    restart: unless-stopped
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      - private-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  memcached:
    image: memcached:1.6-alpine
    container_name: memcached
    restart: unless-stopped
    command:
      - memcached
      - -m
      - "256"
      - -c
      - "1024"
      - -t
      - "2"
    ports:
      - "11211:11211"
    mem_limit: 512m
    cpus: 0.5
    networks:
      - db-network


  nginx:
    image: nginx:1.27.2
    depends_on:
      - frontend
      - backend
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      - public-network
      - private-network
      - monitoring-network
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --docker_only=true
    mem_limit: 256M
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - public-network
      - monitoring-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --web.external-url=http://localhost/prometheus
      - --web.route-prefix=/prometheus
    mem_limit: 512M
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: http://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256M
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - public-network
      - monitoring-network

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    mem_limit: 256M
    cpus: '0.5'
    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128M
    cpus: '0.25'
    networks:
      - monitoring-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - telegram_token
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=http://localhost/alertmanager
      - --web.route-prefix=/alertmanager
    mem_limit: 128M
    cpus: '0.25'
    networks:
      - monitoring-network
      - public-network

volumes:
  db_data:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  db_password:
    file: ./secrets/db_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  telegram_token:
    file: ./secrets/telegram_token

networks:
  public-network:
  private-network:
    internal: true
  db-network:
    internal: true
  monitoring-network:
    internal: true
