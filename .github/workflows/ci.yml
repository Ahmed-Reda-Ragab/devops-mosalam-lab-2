name: CI

# lint + test  ->  build  ->  push images to Docker Hub (main only).
# No deploy step by design: images are published to the registry and a server
# can pull them later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tms-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/tms-frontend

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- lint + test
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest httpx

      - name: Ruff (lint)
        run: ruff check backend/app backend/tests --config backend/ruff.toml

      - name: Pytest
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "3306"
          DB_DATABASE: testdb
          DB_USERNAME: test
          DB_PASSWORD: test
        run: pytest -q

      - name: Hadolint (backend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Hadolint (frontend Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  # ------------------------------------------------------------- build + push
  build-and-push:
    name: Build & push
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build on every push/PR to validate the Dockerfiles. On main the push
      # steps below reuse this GHA layer cache, so the rebuild is near-instant.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- push only on main, never on PRs (where secrets are unavailable) ----
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend (latest + sha)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - name: Push frontend (latest + sha)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
