# OpenTelemetry Collector — the single ingest point for telemetry.
#
# Why a collector at all when Tempo can receive OTLP directly?
#   * The app only ever knows one endpoint (otel-collector:4317). Swapping
#     Tempo for Jaeger/Datadog/anything else is a config change here, not a
#     rebuild + redeploy of every service.
#   * Batching + memory limiting happen outside the app process, so a slow or
#     down backend degrades the collector, not the request path.
#   * Central place to sample, drop noisy spans and scrub PII before storage.
#
# Pipeline: receivers -> processors -> exporters (order of processors matters).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317   # used by the FastAPI backend and Traefik
      http:
        endpoint: 0.0.0.0:4318   # for browser / curl style OTLP-HTTP senders

processors:
  # MUST be first: refuses new data before the container hits its 256M
  # mem_limit and gets OOM-killed by Docker.
  memory_limiter:
    check_interval: 1s
    limit_mib: 180
    spike_limit_mib: 40

  # Groups spans into fewer, larger export calls — the single biggest lever on
  # collector CPU and network overhead.
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Adds host/OS/container attributes so spans carry where they ran.
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
    override: false

exporters:
  # Ship traces to Tempo over OTLP/gRPC. Plaintext is fine: the hop never
  # leaves the internal monitoring-network.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
    sending_queue:
      enabled: true
      queue_size: 1000

  # Any OTLP *metrics* an app pushes get re-exposed in Prometheus format on
  # :8889 and scraped by Prometheus (see prometheus/prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133   # container healthcheck target

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
  telemetry:
    logs:
      level: info
    metrics:
      # The collector's own health metrics (queue depth, refused spans, ...).
      address: 0.0.0.0:8888
