route:
  receiver: telegram
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_token
        chat_id: -5406600269
        parse_mode: HTML
        send_resolved: true
        message: |-
          {{ range .Alerts }}<b>[{{ .Labels.severity | toUpper }}] {{ .Labels.alertname }}</b> — {{ .Status | toUpper }}
          {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
