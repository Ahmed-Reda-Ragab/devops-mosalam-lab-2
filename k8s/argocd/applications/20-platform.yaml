# ============================================================================
#  Wave -1 — cluster prerequisites: the cert-manager ClusterIssuers.
#
#  They must exist before the Certificate in k8s/production/gateway/ references
#  them, otherwise it sits in a permanent "issuer not found" state.
#
#  Both issuers solve HTTP-01 through the GATEWAY (gatewayHTTPRoute), so
#  cert-manager needs its Gateway API feature gate on:
#     --feature-gates=ExperimentalGatewayAPISupport=true
#  It is OFF by default, and without it these issuers never solve a challenge.
#
#  NOTE: cert-manager ITSELF is not managed here — see k8s/argocd/addons/
#  cert-manager.yaml for an optional Application that installs it, or install it
#  with Helm. This Application only configures it.
#  The ingress controller is gone entirely: routing is Gateway API now, and the
#  bundled rke2-ingress-nginx is disabled in the RKE2 config.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-manager-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: task-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: task-manager
  source:
    repoURL: https://github.com/Ahmed-Reda-Ragab/devops-mosalam-lab-2.git
    targetRevision: main
    path: k8s/production/platform
    directory:
      recurse: true
      exclude: "*.example"
  destination:
    server: https://kubernetes.default.svc
    # ClusterIssuers are cluster-scoped, so this matches the project's ""
    # destination. Nothing namespaced lives in this path.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  revisionHistoryLimit: 5
