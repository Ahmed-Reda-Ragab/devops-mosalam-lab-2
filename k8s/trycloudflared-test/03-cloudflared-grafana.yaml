# ============================================================================
#  TEST ONLY — Cloudflare Quick Tunnel -> Grafana.
#  Not synced by Argo CD. Usage and cleanup: README.md in this folder.
#  Needs monitoring stage M2 (Grafana) to be running.
#
#  Lives IN the monitoring namespace on purpose: monitoring/networkpolicy.yaml
#  lets Grafana be reached only from inside that namespace
#  (allow-intra-namespace + uis-deny-cross-namespace). A cloudflared pod in any
#  other namespace would be dropped.
#
#  Open https://<link>.trycloudflare.com/grafana/ — Grafana serves from the
#  /grafana sub-path (GF_SERVER_SERVE_FROM_SUB_PATH). No --http-host-header:
#  Grafana's CSRF check compares the browser's Origin with the Host header, so
#  the Host must stay the trycloudflare.com name or the login POST is refused.
#
#  Prometheus and Alertmanager have NO login, so there is deliberately no tunnel
#  for them here — use the SSH tunnel from docs/08.
#
#  The telegram-notify sidecar sends the link, /grafana/ included, to the same
#  bot and chat as Alertmanager (see 02-cloudflared-tasks.yaml). It needs
#  Secret cloudflared-telegram in monitoring:
#    bash k8s/scripts/create-secrets.sh monitoring
#  Without it the tunnel still works; get the link from the logs instead:
#  kubectl logs -n monitoring -l app=cloudflared-grafana --tail=100 | grep -A2 "Your quick Tunnel"
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-grafana
  namespace: monitoring
  labels:
    app: cloudflared-grafana
    app.kubernetes.io/part-of: trycloudflared-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-grafana
  template:
    metadata:
      labels:
        app: cloudflared-grafana
        app.kubernetes.io/part-of: trycloudflared-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532   # lets 65532 read the 0440 token file
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://grafana.monitoring.svc.cluster.local:3000
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi

        # Asks cloudflared's metrics server for the link instead of parsing logs:
        # /quicktunnel returns {"hostname":"xxxx.trycloudflare.com"}. Waits for
        # /ready, so the link already answers when the message arrives. Loops
        # instead of exiting: if the cloudflared container restarts it gets a new
        # link, and that one is sent too.
        # The same block is in every file of this folder; only LINK_PATH differs.
        - name: telegram-notify
          image: curlimages/curl:8.22.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              TOKEN_FILE=/run/secrets/telegram_token
              last=""
              said=""
              # Logs a line only when it differs from the previous one: a wait
              # that lasts minutes is one line, not one every 10 seconds.
              say() { [ "$1" = "$said" ] || echo "$1"; said=$1; }
              echo "started, chat $CHAT_ID, checking every 10s"
              while true; do
                sleep 10
                if [ ! -s "$TOKEN_FILE" ]; then
                  say "waiting: no $TOKEN_FILE, run: bash k8s/scripts/create-secrets.sh $POD_NAMESPACE"
                  continue
                fi
                code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2000/ready)
                if [ "$code" != 200 ]; then
                  say "waiting: cloudflared /ready answered $code (no connection to Cloudflare yet)"
                  continue
                fi
                host=$(curl -fs http://127.0.0.1:2000/quicktunnel | sed -n 's/.*"hostname":"\([^"]*\)".*/\1/p')
                host=${host#https://}   # newer cloudflared may already include it
                if [ -z "$host" ]; then
                  say "waiting: /quicktunnel has no hostname yet"
                  continue
                fi
                [ "$host" != "$last" ] || continue
                text=$(printf '<b>%s</b>: new link\nhttps://%s%s\npod %s on %s' "$APP" "$host" "$LINK_PATH" "$POD_NAME" "$NODE_NAME")
                resp=$(curl -sS --max-time 15 "https://api.telegram.org/bot$(cat "$TOKEN_FILE")/sendMessage" \
                  --data-urlencode "chat_id=$CHAT_ID" \
                  --data-urlencode "parse_mode=HTML" \
                  --data-urlencode "text=$text")
                case "$resp" in
                  *'"ok":true'*) say "sent https://$host$LINK_PATH"; last=$host ;;
                  *) say "telegram send failed, retrying every 10s: $resp" ;;
                esac
              done
          env:
            - name: CHAT_ID
              value: "-5406600269"   # same chat as alertmanager.yml
            # Appended to the link: the path this UI is served on.
            - name: LINK_PATH
              value: /grafana/
            - name: APP
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app']
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: telegram
              mountPath: /run/secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
      volumes:
        # optional: a missing Secret must not block the tunnel itself.
        - name: telegram
          secret:
            secretName: cloudflared-telegram
            optional: true
            defaultMode: 0440
