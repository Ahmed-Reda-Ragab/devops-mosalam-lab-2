# ============================================================================
#  TEST ONLY — Cloudflare Quick Tunnel -> Grafana.
#  Not synced by Argo CD. Usage and cleanup: README.md in this folder.
#  Needs monitoring stage M2 (Grafana) to be running.
#
#  Lives IN the monitoring namespace on purpose: monitoring/networkpolicy.yaml
#  lets Grafana be reached only from inside that namespace
#  (allow-intra-namespace + uis-deny-cross-namespace). A cloudflared pod in any
#  other namespace would be dropped.
#
#  Open https://<link>.trycloudflare.com/grafana/ — Grafana serves from the
#  /grafana sub-path (GF_SERVER_SERVE_FROM_SUB_PATH). No --http-host-header:
#  Grafana's CSRF check compares the browser's Origin with the Host header, so
#  the Host must stay the trycloudflare.com name or the login POST is refused.
#
#  Prometheus and Alertmanager have NO login, so there is deliberately no tunnel
#  for them here — use the SSH tunnel from docs/08.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-grafana
  namespace: monitoring
  labels:
    app: cloudflared-grafana
    app.kubernetes.io/part-of: trycloudflared-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared-grafana
  template:
    metadata:
      labels:
        app: cloudflared-grafana
        app.kubernetes.io/part-of: trycloudflared-test
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.3
          args:
            - tunnel
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://grafana.monitoring.svc.cluster.local:3000
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
