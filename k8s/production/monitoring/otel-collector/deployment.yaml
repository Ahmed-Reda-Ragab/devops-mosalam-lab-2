# ============================================================================
#  OpenTelemetry Collector — Compose service "otel-collector".
#  Stateless (it batches in memory and forwards), so a plain Deployment, and
#  the only component in the monitoring stack that can safely run 2 replicas.
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: traces
    app.kubernetes.io/part-of: task-manager
spec:
  # One on the lab's small nodes. Prometheus scrapes it through the Service
  # (static target), so with two replicas each scrape hit a random one and the
  # self-metrics jumped between them anyway.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/component: traces
        app.kubernetes.io/part-of: task-manager
      # NOT annotated for pod scraping: it serves two different metric sets on
      # two ports, which one annotation cannot express. Prometheus reaches both
      # through the dedicated otel-collector / otel-collector-apps jobs.
    spec:
      serviceAccountName: otel-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.109.0
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 4317    # the backend pushes here
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: self-metrics
              containerPort: 8888    # collector own health
              protocol: TCP
            - name: app-metrics
              containerPort: 8889    # app metrics re-exported as Prometheus
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          # Compose ran the binary with --version, which only proves the binary
          # exists. The health_check extension actually reports whether the
          # pipelines are running.
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              # Must stay above memory_limiter limit_mib + spike_limit_mib
              # (384 + 96 = 480Mi) or the kubelet kills the pod before the
              # limiter ever gets a chance to push back.
              memory: 640Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
