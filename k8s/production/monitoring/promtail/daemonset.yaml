# ============================================================================
#  Promtail — Compose service "promtail", now a DaemonSet.
#
#  Compose ran ONE promtail that read every container's logs through the Docker
#  API. There is no cluster-wide equivalent: container logs are files on the
#  node that wrote them, so one agent per node is the only way to collect them
#  all. This is the shape change that surprises people most when moving a
#  Compose logging stack to Kubernetes.
#
#  Runs as root. The files under /var/log/pods are root-owned with no
#  world-read bit, so there is no non-root option short of running a privileged
#  init that relaxes the permissions. This is also why the monitoring namespace
#  is PSS-privileged.
# ============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: logs
    app.kubernetes.io/part-of: task-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/component: logs
        app.kubernetes.io/part-of: task-manager
      annotations:
        # -> job="promtail", same as the Compose scrape config.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
    spec:
      serviceAccountName: promtail
      # Collect from every node, including tainted ones — a node whose logs you
      # cannot read is a node you cannot debug.
      tolerations:
        - operator: Exists
      containers:
        - name: promtail
          image: grafana/promtail:3.2.0
          args:
            - -config.file=/etc/promtail/promtail.yaml
            # Makes ${HOSTNAME} in the config resolve (the node-name selector).
            - -config.expand-env=true
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
              readOnly: true
            # The log files themselves. /var/log/pods holds SYMLINKS into the
            # container runtime's directory, so both have to be mounted or the
            # symlinks dangle and Promtail reads nothing — silently, because the
            # glob just matches no readable file.
            #
            # RKE2 RUNS ITS OWN CONTAINERD, rooted at
            #   /var/lib/rancher/rke2/agent/containerd
            # not the distro default /var/lib/containerd. Mounting the wrong one
            # is the single most common reason "Loki has no logs" on RKE2.
            # Confirm on a node with:
            #   ls -l /var/log/pods/*/*/0.log | head
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: containerd
              mountPath: /var/lib/rancher/rke2/agent/containerd
              readOnly: true
            - name: positions
              mountPath: /run/promtail
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            # Required to read root-owned log files. See the header.
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/log/containers
        - name: containerd
          hostPath:
            path: /var/lib/rancher/rke2/agent/containerd
        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate
