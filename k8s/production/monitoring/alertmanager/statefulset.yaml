# ============================================================================
#  Alertmanager — Compose service "alertmanager".
#
#  StatefulSet because /alertmanager holds the silences and the notification
#  log. Losing that on a restart means every currently-firing alert is
#  re-notified from scratch and every silence you set disappears — which turns a
#  routine pod restart into a wall of duplicate Telegram messages.
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: task-manager
spec:
  serviceName: alertmanager
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/component: alerting
        app.kubernetes.io/part-of: task-manager
      annotations:
        # -> job="alertmanager", matching the Compose scrape config.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9093"
        prometheus.io/path: "/alertmanager/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.external-url=https://el-programmer.click/alertmanager
            - --web.route-prefix=/alertmanager
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          readinessProbe:
            httpGet:
              path: /alertmanager/-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /alertmanager/-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

        # Same reason as Prometheus: without this, editing a receiver or the
        # message template in git would not take effect until someone manually
        # restarted the pod.
        - name: config-reloader
          image: ghcr.io/jimmidyson/configmap-reload:v0.13.1
          args:
            - --volume-dir=/etc/alertmanager
            - --webhook-url=http://127.0.0.1:9093/alertmanager/-/reload
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: secrets
          secret:
            secretName: alertmanager-secrets
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: gp3
        resources:
          requests:
            storage: 1Gi   # silences + notification log, a few KB
