# ============================================================================
#  Loki config — NEW FILE. The Compose stack ran grafana/loki with no config at
#  all, relying on the image's baked-in /etc/loki/local-config.yaml. That works
#  until it does not: the defaults carry no retention, so the volume grows
#  forever, and the next image bump can silently change the schema.
#
#  This is the single-binary / filesystem layout, which is the right shape for
#  one node's worth of logs. When it outgrows local disk, change
#  `object_store: filesystem` to s3/gcs and point `common.storage` at a bucket —
#  nothing else here has to move.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logs
    app.kubernetes.io/part-of: task-manager
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: info

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # 7 days. Logs are the cheapest signal to keep but the bulkiest on disk;
      # Tempo keeps 48h of traces and Prometheus 15d of metrics, so this sits
      # deliberately in between.
      retention_period: 168h
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20
      # Required for the OTel-style structured metadata Promtail can attach.
      allow_structured_metadata: true
      # Powers Grafana's "Logs volume" histogram above the results.
      volume_enabled: true

    compactor:
      working_directory: /loki/compactor
      # Retention is NOT enforced unless the compactor is told to do it. This
      # single line is the difference between "7 day retention" and "the PVC
      # fills up in a month".
      retention_enabled: true
      delete_request_store: filesystem

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    # Do not phone home.
    analytics:
      reporting_enabled: false
