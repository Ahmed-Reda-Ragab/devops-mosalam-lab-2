# ============================================================================
#  Prometheus — Compose service "prometheus".
#
#  StatefulSet rather than Deployment: the TSDB is a single-writer, file-locked
#  database. A Deployment rolling update would briefly run two pods against the
#  same PVC, and the new one would fail on the lock. A StatefulSet guarantees
#  the old pod is fully gone first.
#
#  Every command-line flag is carried over unchanged from the Compose file,
#  including --web.route-prefix=/prometheus (which is why the self-scrape uses
#  /prometheus/metrics and Tempo's remote_write URL carries the prefix too).
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: task-manager
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: metrics
        app.kubernetes.io/part-of: task-manager
    spec:
      serviceAccountName: prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534      # nobody, the uid the image ships with
        fsGroup: 65534
      terminationGracePeriodSeconds: 300   # let it flush the head block
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --web.console.libraries=/usr/share/prometheus/console_libraries
            - --web.console.templates=/usr/share/prometheus/consoles
            # Public canonical URL (used to build absolute links / redirects).
            - --web.external-url=https://el-programmer.click/prometheus
            - --web.route-prefix=/prometheus
            # Tempo's metrics_generator remote-writes span metrics + service-graph
            # series here, so the write endpoint must be enabled (it is off by
            # default). Without it Tempo logs 404s and the Service Map stays empty.
            - --web.enable-remote-write-receiver
            # Store exemplars: the trace IDs Tempo attaches to those series are
            # what makes the "metric spike -> jump to the exact trace" link work.
            - --enable-feature=exemplar-storage
            # Lets the config-reloader sidecar POST /-/reload instead of us
            # having to restart the pod on every rule change.
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /prometheus/-/ready
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /prometheus/-/healthy
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              # 512Mi in Compose. Kubernetes SD means many more series (every
              # pod, every container, every node) — the head block alone will
              # exceed the old limit within a day.
              memory: 2Gi

        # --- sidecar: hot-reload on ConfigMap change -----------------------
        # Argo CD updates the ConfigMap in place, and the kubelet propagates the
        # new content into the mounted volume within ~60s. But Prometheus only
        # reads its config at startup, so without this a rule change would sit
        # on disk, unused, until someone noticed. This watches the mount and
        # POSTs /-/reload.
        - name: config-reloader
          image: ghcr.io/jimmidyson/configmap-reload:v0.13.1
          args:
            - --volume-dir=/etc/prometheus
            - --volume-dir=/etc/prometheus/rules
            - --webhook-url=http://127.0.0.1:9090/prometheus/-/reload
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-alerts
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: gp3
        resources:
          requests:
            storage: 50Gi
