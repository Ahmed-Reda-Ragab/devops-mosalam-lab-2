# Compose published 3100:3000 on the host for debugging. Here it is a ClusterIP
# behind the Ingress at /grafana; for ad-hoc access use
#   kubectl -n monitoring port-forward svc/grafana 3000:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboards
    app.kubernetes.io/part-of: task-manager
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
