# ============================================================================
#  MySQL Primary (read/write) — Compose service "mysql-primary".
#
#  Why a StatefulSet and not a Deployment:
#    * stable network identity   -> the replica and ProxySQL address it by name
#    * stable storage            -> the PVC is bound to this pod, forever
#    * ordered, one-at-a-time    -> never two mysqld on the same data directory
#
#  Compose                       ->  Kubernetes
#  --------------------------------------------------------------------------
#  volumes: mysql_primary_data   ->  volumeClaimTemplates (a real PVC/PV)
#  secrets: [...]                ->  Secret projected at /run/secrets
#  ../mysql/primary/my.cnf:ro    ->  ConfigMap mysql-primary-cnf (subPath)
#  init scripts bind-mounts      ->  ConfigMap mysql-primary-init
#  healthcheck: mysqladmin ping  ->  startup + readiness + liveness probes
#  mem_limit: 512M / cpus: 1     ->  resources.requests / resources.limits
# ============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-primary
  namespace: tasks-db
  labels:
    app.kubernetes.io/name: mysql-primary
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: task-manager
spec:
  serviceName: mysql-primary
  # Exactly one. server-id is hardcoded to 1 in the ConfigMap, and two writers
  # on GTID replication without group replication would corrupt the topology.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-primary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-primary
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: task-manager
    spec:
      # The image starts as root, prepares /var/lib/mysql, then drops to the
      # mysql user (uid 999). fsGroup makes a freshly provisioned PV group-owned
      # by 999 so that drop actually has write access.
      securityContext:
        fsGroup: 999
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --defaults-file=/etc/mysql/my.cnf
          env:
            # The official entrypoint reads *_FILE variants — same mechanism the
            # Compose stack used with Docker secrets.
            - name: MYSQL_ROOT_PASSWORD_FILE
              value: /run/secrets/mysql_root_password
            - name: MYSQL_PASSWORD_FILE
              value: /run/secrets/db_password
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: db-config
                  key: DB_USERNAME
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: cnf
              mountPath: /etc/mysql/my.cnf
              subPath: my.cnf
              readOnly: true
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          # First boot runs the schema + account scripts, which can take a
          # while. The startup probe gives it up to 5 minutes (30 x 10s) before
          # the liveness probe is allowed to start killing the container —
          # this is the k8s equivalent of Compose's start_period: 40s.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/mysql_root_password)" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/mysql_root_password)" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$(cat /run/secrets/mysql_root_password)" --silent
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # Compose used mem_limit: 512M. Raised here on purpose: the
              # kubelet kills instantly at the limit (Docker's mem_limit had the
              # same semantics but MySQL was never actually pushed there in the
              # single-VM setup). 256M buffer pool + ~400M baseline RSS leaves
              # almost no headroom at 512Mi.
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: cnf
          configMap:
            name: mysql-primary-cnf
            defaultMode: 0644
        - name: init
          configMap:
            name: mysql-primary-init
            # 0755 so the entrypoint EXECUTES 10-replication.sh as a subprocess
            # instead of sourcing it — its `set -euo pipefail` then cannot leak
            # into the entrypoint and abort the whole initialisation.
            defaultMode: 0755
        - name: secrets
          secret:
            secretName: mysql-secrets
            defaultMode: 0400
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Left unset on purpose -> the cluster's default StorageClass is used
        # (gp3 on EKS, standard-rwo on GKE, managed-csi on AKS). Pin it here if
        # you need a specific one:
        #   storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
