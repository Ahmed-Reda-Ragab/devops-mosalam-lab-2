# ============================================================================
#  Adminer — web DB UI. Compose service "adminer".
#  Lives in tasks-db so it can reach MySQL directly. NOT published: its route
#  ships disabled (httproute.yaml.optional). Reach it on demand with
#     kubectl -n tasks-db port-forward svc/adminer 8083:8080
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adminer
  namespace: tasks-db
  labels:
    app.kubernetes.io/name: adminer
    app.kubernetes.io/component: db-ui
    app.kubernetes.io/part-of: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adminer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adminer
        app.kubernetes.io/component: db-ui
        app.kubernetes.io/part-of: task-manager
    spec:
      containers:
        - name: adminer
          image: adminer:4.8.1
          env:
            # Pre-fills the server field so you do not have to remember the
            # FQDN.
            - name: ADMINER_DEFAULT_SERVER
              value: mysql-simple.tasks-db.svc.cluster.local:3306
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
