# ============================================================================
#  NetworkPolicies — the replacement for Compose's network segmentation.
#
#  Compose relied on which containers were attached to which Docker network
#  (db-network / private-network, the latter `internal: true`). Kubernetes is
#  flat by default: EVERY pod can reach every other pod. NetworkPolicies are
#  what restore the isolation, and without them this conversion would be a
#  security downgrade from the Compose stack.
#
#  ⚠️  REQUIRES A CNI THAT ENFORCES THEM. Calico, Cilium, AWS VPC CNI (with
#  ENABLE_NETWORK_POLICY=true) and Azure NPM all do. GKE needs Dataplane V2 or
#  --enable-network-policy. On a CNI that ignores policies these objects apply
#  cleanly and silently do nothing — verify with a test pod, do not assume.
#
#  Only INGRESS is restricted here. Egress is left open on purpose: locking it
#  down also blocks DNS, the OTLP push to the monitoring namespace and the
#  ACME/Let's Encrypt traffic, and getting that wrong fails in ways that are
#  genuinely hard to debug. Add egress rules later, one service at a time.
# ============================================================================

# --- 1. Default deny: nothing may enter a tasks-db pod unless allowed below --
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector: {}          # every pod in the namespace
  policyTypes:
    - Ingress
---
# --- 2. MySQL accepts connections only from ProxySQL, the backup Job and
#        Adminer. Nothing in tasks-app can reach the database directly, which
#        is the whole point of putting ProxySQL in front of it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-internal
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [mysql-primary, mysql-replica]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: proxysql
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adminer
        # The replica's IO thread connects to the primary.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-replica
      ports:
        - protocol: TCP
          port: 3306
---
# --- 3. ProxySQL is the one door into the data tier, open to the app namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: proxysql-allow-apps
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: proxysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tasks-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: adminer
      ports:
        - protocol: TCP
          port: 6033
---
# --- 4. Memcached: same story — reachable from the app namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memcached-allow-apps
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: memcached
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tasks-app
      ports:
        - protocol: TCP
          port: 11211
---
# --- 5. Adminer.
#        There is NO rule for the Gateway here, and that is not an omission.
#        Cilium's Gateway Envoy runs in the host network namespace, so its
#        traffic arrives with the reserved:host identity, which no Kubernetes
#        NetworkPolicy selector can name and which Cilium allows by default
#        (the kubelet's probes share that identity). The full reasoning is in
#        the header of ../apps/networkpolicy.yaml.
#
#        What this rule DOES buy: nothing else in the cluster can reach the
#        Adminer UI pod-to-pod, so a compromised pod in another namespace cannot
#        use it as a database console.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: adminer-deny-pod-to-pod
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: adminer
  policyTypes:
    - Ingress
  # No ingress rules at all: default-deny for every pod source. The Gateway path
  # stays open via Cilium's host exemption.
  ingress: []
---
# --- 6. Let Prometheus scrape anything in here that exposes metrics later
#        (nothing does today; this saves a confusing debug session when you add
#        mysqld-exporter or proxysql-exporter).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
