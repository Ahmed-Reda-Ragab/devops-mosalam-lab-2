# ============================================================================
#  Nightly mysqldump — Compose service "mysql-backup".
#
#  The Compose crontab (backup-mysql/crontab) had TWO backup lines:
#      0 2 * * *   nightly full backup
#      0 * * * *   the same script, every hour   <-- almost certainly a
#                  leftover from testing: it overwrites the same day's dump
#                  24 times and makes the retention count meaningless.
#  Only the nightly schedule is kept here. Add a second CronJob if the hourly
#  run was intentional — but give it its own BACKUP_ROOT so the two do not
#  clobber each other.
# ============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
  namespace: tasks-db
  labels:
    app.kubernetes.io/name: mysql-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: task-manager
spec:
  # 02:00 in the cluster's timezone. The kube-controller-manager runs on UTC
  # unless timeZone is set, so set it explicitly rather than guessing.
  schedule: "0 2 * * *"
  timeZone: "Africa/Cairo"
  # Never two dumps at once — they would fight over the ReadWriteOnce PVC.
  concurrencyPolicy: Forbid
  # If the controller was down at 02:00, still run when it comes back — but
  # only within an hour, otherwise skip to tomorrow.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Retry twice, then mark the Job failed so it shows up in
      # `kubectl get jobs` (and in the KubeJobFailed alert if you add one).
      backoffLimit: 2
      # Kill a dump that has been running for over 2 hours.
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mysql-backup
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: task-manager
        spec:
          restartPolicy: OnFailure
          securityContext:
            fsGroup: 999
          containers:
            - name: backup
              image: mysql:8.0
              command: ["/bin/bash", "/scripts/backup.sh"]
              env:
                - name: MYSQL_HOST
                  value: mysql-primary.tasks-db.svc.cluster.local
                - name: MYSQL_PORT
                  value: "3306"
                - name: MYSQL_USER
                  value: root
                - name: RETENTION_DAYS
                  value: "30"
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: secrets
                  mountPath: /run/secrets
                  readOnly: true
                - name: backups
                  mountPath: /backup/backups
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: scripts
              configMap:
                name: mysql-backup-script
                defaultMode: 0755
            - name: secrets
              secret:
                secretName: mysql-secrets
                defaultMode: 0400
            - name: backups
              persistentVolumeClaim:
                claimName: mysql-backup
