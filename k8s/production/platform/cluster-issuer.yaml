# ============================================================================
#  cert-manager ClusterIssuer — replaces Traefik's built-in ACME resolver.
#
#  HTTP-01 as before, but solved through the GATEWAY instead of an Ingress.
#  cert-manager's gatewayHTTPRoute solver creates a temporary HTTPRoute that
#  attaches to the Gateway named in parentRefs and serves
#  /.well-known/acme-challenge/... for the duration of the challenge, then
#  deletes it. The Ingress-based solver (solvers[].http01.ingress) would create
#  an Ingress object, which nothing in this cluster serves any more.
#
#  REQUIRES:
#    * cert-manager >= v1.15 with the Gateway API feature gate. It is OFF by
#      default — the flag is --feature-gates=ExperimentalGatewayAPISupport=true
#      on the cert-manager controller (Helm: featureGates). Without it this
#      issuer silently never solves a challenge.
#    * the Gateway in k8s/production/gateway/ to exist and have an HTTP listener
#      on :80 that allows Routes from the cert-manager namespace.
#
#  Two issuers:
#    letsencrypt-staging -> use while testing. Untrusted cert, but NO rate
#                           limits, so a broken DNS setup costs nothing.
#    letsencrypt-prod    -> the real thing. Only 5 duplicate certs per domain
#                           per week, so switch once staging has succeeded.
# ============================================================================
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: info@el-programmer.click
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            # The challenge HTTPRoute attaches here. Must match the Gateway in
            # k8s/production/gateway/gateway.yaml exactly, including namespace.
            parentRefs:
              - name: main
                namespace: gateway
                kind: Gateway
                group: gateway.networking.k8s.io
                # The plain-HTTP listener. ACME validation is HTTP-only by
                # design (the whole point is that you have no cert yet), so it
                # must NOT be sent to the https listener.
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: info@el-programmer.click
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: main
                namespace: gateway
                kind: Gateway
                group: gateway.networking.k8s.io
                sectionName: http
