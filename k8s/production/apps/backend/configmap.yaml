# ============================================================================
#  Backend configuration — the merge of compose/.env and the `environment:`
#  block of the backend service in compose/docker-compose.apps.yml.
#
#  Every hostname gained a namespace suffix, because the backend now lives in
#  tasks-app while its dependencies live in tasks-db and monitoring. Short names
#  would only resolve inside the pod's own namespace.
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tasks-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: task-manager
data:
  # --- Database: the app talks to ProxySQL, never to MySQL directly ---------
  DB_HOST: proxysql.tasks-db.svc.cluster.local
  DB_PORT: "6033"
  DB_DATABASE: appdb
  DB_USERNAME: appuser

  # --- Cache ---------------------------------------------------------------
  CACHE_BACKEND: memcached
  CACHE_HOST: memcached.tasks-db.svc.cluster.local
  CACHE_PORT: "11211"
  CACHE_TTL_SECONDS: "60"

  # --- OpenTelemetry tracing ----------------------------------------------
  # The app only ever knows the collector; the collector decides where the
  # traces end up (Tempo today).
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc.cluster.local:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  # Becomes the node name in Grafana's Service Map and the join key for the
  # trace <-> logs links (matched against Promtail's `service` label).
  OTEL_SERVICE_NAME: backend
  OTEL_SERVICE_VERSION: "1.0"
  DEPLOY_ENV: production
  # Sample 100% — fine at this traffic level. Lower it (0.1 = 10%) when trace
  # volume starts costing more than it tells you; ingress-nginx's
  # otel-sampler-ratio should be lowered to match, since the edge decides first
  # and the backend honours that decision (ParentBased sampler).
  OTEL_TRACES_SAMPLER_ARG: "1.0"
