# ============================================================================
#  NetworkPolicies for tasks-app — the equivalent of Compose's
#  private-network: internal: true, where only Traefik could reach the backend
#  and frontend.
#
#  ── HOW GATEWAY TRAFFIC APPEARS, AND WHY THERE IS NO RULE FOR IT ──────────
#  The Ingress version of this file allowed traffic from the ingress controller's
#  NAMESPACE, because that controller was an ordinary pod with a pod identity.
#  Cilium's Gateway is not: with gatewayAPI.hostNetwork.enabled=true its Envoy
#  runs in the host network namespace, so a request proxied to the backend
#  arrives carrying Cilium's reserved:host identity — not a pod IP, and not a
#  namespace. A Kubernetes NetworkPolicy has no selector that can name it.
#
#  Cilium also allows reserved:host -> pod ingress unconditionally by default
#  (hostAllowLocalhost: auto). That is deliberate on Cilium's part: the kubelet's
#  liveness and readiness probes come from the same identity, so blocking it
#  would make every probe fail. The practical consequence for this file: Gateway
#  traffic is NOT what these policies control, and adding an ipBlock of node
#  addresses would be security theatre.
#
#  To actually constrain what the Gateway may ask for, you need a
#  CiliumNetworkPolicy with fromEntities: [host, remote-node] and L7 rules — see
#  routes/ciliumnetworkpolicy-api-key.yaml.optional, which is exactly that.
#
#  These policies therefore cover what they can cover well: POD-TO-POD traffic
#  inside and into the namespace.
#
#  ── ON THE LAB CLUSTER THE GATEWAY IS TRAEFIK, AND THAT CHANGES THE ABOVE ──
#  Traefik (traefik/public) runs as ordinary pods with hostPort, NOT
#  hostNetwork, so its requests DO carry a pod identity — the traefik
#  namespace — and the default-deny below blocks them. Policy 4 at the end lets
#  exactly that through. Without it the page loads forever and then errors.
#
#  ⚠️  Your CNI is Cilium, so these are enforced. On a CNI that ignores
#  NetworkPolicy they would apply cleanly and do nothing.
# ============================================================================

# --- 1. Default deny ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tasks-app
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# --- 2. Backend: Locust and Prometheus ---------------------------------------
# Gateway traffic is absent on purpose — see the header.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-allow
  namespace: tasks-app
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Load tests hit the Service directly, bypassing the Gateway.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: locust
        # Prometheus scrapes /metrics on the same port.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
---
# --- 3. Frontend and Locust --------------------------------------------------
# Both are reached ONLY through the Gateway, which as explained above is not
# expressible here. The policy exists so that nothing ELSE in the cluster can
# reach them: no pod-to-pod source is allowed, and the default-deny above plus
# Cilium's host exemption leaves exactly the Gateway path open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-deny-pod-to-pod
  namespace: tasks-app
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [frontend, locust]
  policyTypes:
    - Ingress
  ingress:
    # Prometheus only — nothing else in the cluster has business talking to them.
    # POD ports, not Service ports: the frontend Service is :80, but nginx in
    # the pod listens on 8080, and that is what a NetworkPolicy matches.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8089
---
# --- 4. Traefik -> frontend and backend --------------------------------------
# The lab cluster's Gateway (see the header). Pod ports again: frontend 8080,
# backend 8000. Locust is left out on purpose — its route ships disabled
# (routes/httproute-locust.yaml.optional); add 8089 and locust here if you
# enable it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-traefik
  namespace: tasks-app
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [frontend, backend]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8000
