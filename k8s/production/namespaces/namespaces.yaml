# ============================================================================
#  Namespaces — the Kubernetes replacement for the Compose networks.
#
#  Compose                     ->  Kubernetes
#  --------------------------------------------------------------------------
#  private-network (internal)  ->  namespace  tasks-app     + NetworkPolicy
#  db-network                  ->  namespace  tasks-db      + NetworkPolicy
#  monitoring-network          ->  namespace  monitoring    + NetworkPolicy
#  public-network              ->  namespace  gateway       (the shared Gateway)
#
#  ── THE LABEL THAT GRANTS PLATFORM ACCESS ─────────────────────────────────
#      gateway.el-programmer.click/access: "true"
#
#  The shared Gateway in k8s/production/gateway/gateway.yaml sets
#  allowedRoutes.namespaces.from: Selector against exactly this label. A
#  namespace without it CANNOT attach an HTTPRoute to the Gateway, no matter what
#  its HTTPRoute says — the route gets a NotAllowedByListeners condition and no
#  traffic. Namespaces are cluster-scoped, so only a platform admin can add the
#  label. That is the whole multi-tenancy boundary, in one label.
#
#  The Traefik Gateway the lab cluster runs today (traefik/public) selects on a
#  different label, gateway-access: "true", so tasks-app carries both.
#
#  Pod Security Standards:
#    tasks-app / tasks-db / gateway -> "baseline" (blocks privileged pods; nginx
#                                      and mysql still run fine).
#    monitoring                     -> "privileged": node-exporter and Promtail
#                                      need hostPath / host PID to read the node.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Argo CD never deletes this namespace, not even when its Application is
    # deleted with cascade — that would take the PVCs inside with it.
    argocd.argoproj.io/sync-options: Delete=false
  name: gateway
  labels:
    app.kubernetes.io/part-of: task-manager
    # The Gateway itself lives here, and so do cert-manager's ephemeral ACME
    # solver HTTPRoutes (they are created in the Certificate's namespace). Both
    # need the label, or HTTP-01 validation can never attach to the :80 listener.
    gateway.el-programmer.click/access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Argo CD never deletes this namespace, not even when its Application is
    # deleted with cascade — that would take the PVCs inside with it.
    argocd.argoproj.io/sync-options: Delete=false
  name: tasks-app
  labels:
    app.kubernetes.io/part-of: task-manager
    gateway.el-programmer.click/access: "true"
    # The label the Gateway that actually runs today — Traefik's traefik/public
    # (rke2-cilium-private-cloud/rke2-lab/04-gateway.yaml) — selects on. Without
    # it the task-manager HTTPRoute is NotAllowedByListeners and the site 404s.
    gateway-access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Argo CD never deletes this namespace, not even when its Application is
    # deleted with cascade — that would take the PVCs inside with it.
    argocd.argoproj.io/sync-options: Delete=false
  name: tasks-db
  labels:
    app.kubernetes.io/part-of: task-manager
    # Only Adminer is published from here; MySQL and ProxySQL stay internal and
    # are additionally fenced by database/networkpolicy.yaml.
    gateway.el-programmer.click/access: "true"
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    # Argo CD never deletes this namespace, not even when its Application is
    # deleted with cascade — that would take the PVCs inside with it.
    argocd.argoproj.io/sync-options: Delete=false
  name: monitoring
  labels:
    app.kubernetes.io/part-of: task-manager
    gateway.el-programmer.click/access: "true"
    # node-exporter and Promtail mount /proc, /sys and the node's log tree.
    pod-security.kubernetes.io/enforce: privileged
