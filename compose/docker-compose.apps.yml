services:
  # NOTE: the database (MySQL primary/replica + ProxySQL) and the cache
  # (memcached) now live in the separate database stack:
  #   compose/docker-compose.database.yml
  # The backend reaches ProxySQL (proxysql:6033) and memcached over the
  # shared external "db-network" (see the networks section below).
  backend:
    build:
      context: ../backend
    # db + memcached are external (database stack); cross-project depends_on
    # is not possible, so start the database stack first. The app tolerates a
    # not-yet-ready DB: the engine connects lazily and pool_pre_ping retries.
    env_file:
      - ./.env
    environment:
      CACHE_BACKEND: memcached
      CACHE_HOST: memcached
      CACHE_PORT: 11211
      CACHE_TTL_SECONDS: 60
    secrets:
      - db_password
    expose:
      - '8000'
    labels:
      - traefik.enable=true
        # Backend API (/api) - With Security Middlewares
      - traefik.http.routers.backend.rule=PathPrefix(`/api`)
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls=true
      - traefik.http.routers.backend.tls.certresolver=le
      # issued for el-programmer.click; IP access keeps working on the default
      # self-signed cert.
      - traefik.http.routers.backend.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.backend.priority=100
      - traefik.http.routers.backend.service=backend
      - traefik.http.routers.backend.middlewares=api-ratelimit@file,api-key@file,cors@file,body-limit@file,compression@file,security-headers@file
        # Pro API (/pro-api) - Without Middlewares
      - traefik.http.routers.proBackend.rule=PathPrefix(`/pro-api`)
      - traefik.http.routers.proBackend.entrypoints=websecure
      - traefik.http.routers.proBackend.tls=true
      - traefik.http.routers.proBackend.tls.certresolver=le
      - traefik.http.routers.proBackend.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.proBackend.priority=100
      - traefik.http.routers.proBackend.service=backend
      # Rewrite: /pro-api/* -> /api/*
      - traefik.http.middlewares.pro-api-rewrite.replacepathregex.regex=^/pro-api/(.*)
      - traefik.http.middlewares.pro-api-rewrite.replacepathregex.replacement=/api/$$1
      # Attach the rewrite middleware
      - traefik.http.routers.proBackend.middlewares=pro-api-rewrite
      # Shared Service
      - traefik.http.services.backend.loadbalancer.server.port=8000
      # Docker Network
      - traefik.docker.network=private-network
    restart: unless-stopped
    mem_limit: 512M
    cpus: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - private-network
      - db-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    expose:
      - '80'
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls=true
      - traefik.http.routers.frontend.tls.certresolver=le
      - traefik.http.routers.frontend.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.docker.network=private-network
    restart: unless-stopped
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      - private-network
    healthcheck:
      # Use curl against 127.0.0.1 (not localhost): nginx listens on IPv4 only,
      # but in Alpine `localhost` resolves to IPv6 ::1 first, so BusyBox wget got
      # "connection refused" and the container was wrongly marked unhealthy —
      # which made Traefik refuse to publish the frontend router (404 on /).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  traefik:
    # v3.0.0 hardcoded Docker API 1.24, which Docker Engine 28+/29+ refuses
    # (minimum 1.44). Auto-negotiation of the API version landed in v3.6.1, so
    # do not pin below that.
    image: traefik:v3.7.7
    restart: unless-stopped
    command:
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # API-key auth plugin (Yaegi). Registered here in STATIC config; Traefik
      # fetches + compiles it from GitHub at startup (needs outbound internet on
      # first boot). The middleware instance is defined in
      # traefik/dynamic/api-key.yml and attached to the backend router as
      # api-key@file. The name "api-key-middleware" below MUST match the key used
      # under `plugin:` in that dynamic file.
      - --experimental.plugins.api-key-middleware.moduleName=github.com/dtomlinson91/traefik-api-key-middleware
      - --experimental.plugins.api-key-middleware.version=v0.1.2
      # Only route containers that opt in with traefik.enable=true.
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Dedicated entrypoint for the dashboard so it never collides with the
      # backend's /api routes on the web entrypoint.
      - --entrypoints.dashboard.address=:8080
      - --entrypoints.metrics.address=:9100
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
        # Let's Encrypt (ACME) resolver "le" — HTTP-01 challenge on the web
        # entrypoint (:80). The routers keep PathPrefix-only rules (so they also
        # answer on the raw IP) and declare the domain via tls.domains, which is
        # what lets ACME request a REAL cert for el-programmer.click.
        # PREREQUISITES for issuance to succeed:
        #   1) DNS: an A record  el-programmer.click -> this host's public IP.
        #   2) Port 80 reachable from the internet (needed for the HTTP-01 check).
        # The web->websecure redirect does NOT block the challenge: Traefik
        # serves /.well-known/acme-challenge/ on :80 before applying the redirect.
      - --certificatesresolvers.le.acme.email=info@el-programmer.click
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web

      - --accesslog=true
      - --accesslog.format=json

      - --log.level=INFO
      - --log.format=json

      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --metrics.prometheus.addrouterslabels=true
      - --metrics.prometheus.addserviceslabels=true
      - --metrics.prometheus.addentrypointslabels=true
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080" # Traefik dashboard (basic auth)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
    secrets:
      - traefik_dashboard_users
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=PathPrefix(`/`)
      - traefik.http.routers.dashboard.entrypoints=dashboard
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.middlewares=dashboard-auth@docker,ip-whitelist@file
      - traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/traefik_dashboard_users
      - traefik.docker.network=public-network
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      public-network:
      private-network:
      # Long-form so we can add a network alias: inside monitoring-network the
      # name "el-programmer.click" resolves to this Traefik container. That lets
      # the blackbox exporter probe https://el-programmer.click internally and
      # be served the real Let's Encrypt cert (SNI match) — no public DNS round
      # trip and no NAT-hairpin problems.
      monitoring-network:
        aliases:
          - el-programmer.click

  locust:
    image: locustio/locust:2.31.1
    restart: unless-stopped
    command:
      - -f
      - /mnt/locust/locustfile.py
      - --host=http://backend:8000
    volumes:
      - ../locust:/mnt/locust:ro
    ports:
      - "8089:8089"
    depends_on:
      - backend
    mem_limit: 256M
    cpus: '0.5'
    labels:
      - traefik.enable=true
      # Router
      - traefik.http.routers.locust.rule=Host(`load.el-programmer.click`)
      - traefik.http.routers.locust.entrypoints=websecure
      - traefik.http.routers.locust.tls=true
      - traefik.http.routers.locust.tls.certresolver=le
      # Service
      - traefik.http.services.locust.loadbalancer.server.port=8089
      # Network
      - traefik.docker.network=private-network
    networks:
      - private-network

volumes:
  traefik-letsencrypt:

secrets:
  db_password:
    file: ../secrets/db_password
  traefik_dashboard_users:
    file: ../secrets/traefik_dashboard_users

# Names are pinned (no compose project prefix) so the traefik.docker.network
# labels above match the real Docker network names.
networks:
  public-network:
    name: public-network
  private-network:
    name: private-network
    internal: true
  # Shared with the database stack (compose/docker-compose.database.yml).
  # Create it once with:
  #   docker network create db-network
  db-network:
    external: true
    name: db-network
  monitoring-network:
    name: monitoring-network
    internal: true
