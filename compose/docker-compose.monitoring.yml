services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    command:
      - --docker_only=true

    mem_limit: 256M
    cpus: "0.5"
    labels:
      - traefik.enable=true
      # Router
      - traefik.http.routers.cadvisor.rule=Host(`cadvisor.el-programmer.click`)
      - traefik.http.routers.cadvisor.entrypoints=websecure
      - traefik.http.routers.cadvisor.tls=true
      - traefik.http.routers.cadvisor.tls.certresolver=le
      # Service
      - traefik.http.services.cadvisor.loadbalancer.server.port=8080
      # Network
      - traefik.docker.network=monitoring-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - public-network
      - monitoring-network
      
  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    mem_limit: 128M
    cpus: '0.25'
    logging:
      driver: "local"
    networks:
      - monitoring-network

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    volumes:
      - ../prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    mem_limit: 128M
    cpus: '0.25'
    networks:
      - monitoring-network

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      # Public canonical URL (used to build absolute links / redirects).
      - --web.external-url=https://el-programmer.click/prometheus
      - --web.route-prefix=/prometheus
      # Tempo's metrics_generator remote-writes span metrics + service-graph
      # series here, so the write endpoint must be enabled (it is off by
      # default). Without it Tempo logs 404s and the Service Map stays empty.
      - --web.enable-remote-write-receiver
      # Store exemplars: the trace IDs Tempo attaches to those series are what
      # makes the "metric spike -> jump to the exact trace" link work.
      - --enable-feature=exemplar-storage
    labels:
      - traefik.enable=true
      - traefik.http.routers.prometheus.tls=true
      # certresolver was missing here -> Prometheus would have kept the
      # self-signed cert. Add it + the domain so it shares the real LE cert.
      - traefik.http.routers.prometheus.tls.certresolver=le
      - traefik.http.routers.prometheus.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.priority=100
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - traefik.docker.network=monitoring-network
      # --- Subdomain route: prometheus.el-programmer.click -> 301 to /prometheus ---
      # Prometheus serves under /prometheus (route-prefix), so the subdomain can't
      # serve it at root; instead we redirect it to the canonical path URL.
      - traefik.http.routers.prometheus-sub.rule=Host(`prometheus.el-programmer.click`)
      - traefik.http.routers.prometheus-sub.entrypoints=websecure
      - traefik.http.routers.prometheus-sub.tls=true
      # Host rule -> ACME auto-issues the cert for this subdomain.
      - traefik.http.routers.prometheus-sub.tls.certresolver=le
      - traefik.http.routers.prometheus-sub.service=prometheus
      - traefik.http.routers.prometheus-sub.middlewares=prometheus-sub-redirect
      - traefik.http.middlewares.prometheus-sub-redirect.redirectregex.regex=^https://prometheus\.el-programmer\.click/?(.*)
      - traefik.http.middlewares.prometheus-sub-redirect.redirectregex.replacement=https://el-programmer.click/prometheus/$${1}
      - traefik.http.middlewares.prometheus-sub-redirect.redirectregex.permanent=false
    mem_limit: 512M
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/prometheus/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - monitoring-network

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SERVER_ROOT_URL: https://el-programmer.click/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    secrets:
      - grafana_admin_password
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls=true
      - traefik.http.routers.grafana.tls.certresolver=le
      - traefik.http.routers.grafana.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.grafana.priority=100
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.docker.network=monitoring-network
      # --- Subdomain route: grafana.el-programmer.click -> 301 to /grafana ---
      # Grafana serves from the /grafana sub-path (serve_from_sub_path), so the
      # subdomain redirects to the canonical path URL.
      - traefik.http.routers.grafana-sub.rule=Host(`grafana.el-programmer.click`)
      - traefik.http.routers.grafana-sub.entrypoints=websecure
      - traefik.http.routers.grafana-sub.tls=true
      - traefik.http.routers.grafana-sub.tls.certresolver=le
      - traefik.http.routers.grafana-sub.service=grafana
      - traefik.http.routers.grafana-sub.middlewares=grafana-sub-redirect
      - traefik.http.middlewares.grafana-sub-redirect.redirectregex.regex=^https://grafana\.el-programmer\.click/?(.*)
      - traefik.http.middlewares.grafana-sub-redirect.redirectregex.replacement=https://el-programmer.click/grafana/$${1}
      - traefik.http.middlewares.grafana-sub-redirect.redirectregex.permanent=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    mem_limit: 256M
    cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - public-network
      - monitoring-network

  loki:
    image: grafana/loki:3.2.0
    restart: unless-stopped
    volumes:
      - loki-data:/loki
    mem_limit: 256M
    cpus: '0.5'
    networks:
      - monitoring-network

  promtail:
    image: grafana/promtail:3.2.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    volumes:
      - ../promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128M
    cpus: '0.25'
    networks:
      - monitoring-network

  # --- Tracing: OpenTelemetry Collector -> Tempo -----------------------------
  # otel-collector is the only endpoint the apps know about. It receives OTLP,
  # batches it, and forwards to Tempo. Nothing here is published to the host or
  # to Traefik: traces are read through Grafana, which is already authenticated.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ../otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yml:ro
    depends_on:
      - tempo
    expose:
      - '4317'   # OTLP gRPC  (backend + traefik push here)
      - '4318'   # OTLP HTTP
      - '8888'   # collector self-metrics  -> scraped by Prometheus
      - '8889'   # app metrics re-exported in Prometheus format
    mem_limit: 256M
    cpus: '0.5'
    logging:
      driver: "local"
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - monitoring-network

  # One-shot init: the tempo image runs as uid 10001, but a freshly created
  # named volume is owned by root — Tempo would crash-loop on "permission
  # denied" writing its WAL. This chowns it once and exits (upstream's own
  # compose examples do the same).
  tempo-init:
    image: grafana/tempo:2.6.1
    user: root
    restart: "no"
    entrypoint: ["chown", "-R", "10001:10001", "/var/tempo"]
    volumes:
      - tempo-data:/var/tempo
    networks:
      - monitoring-network

  tempo:
    image: grafana/tempo:2.6.1
    restart: unless-stopped
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ../tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    expose:
      - '3200'   # HTTP API — Grafana's Tempo datasource points here
      - '4317'   # OTLP gRPC — direct push, bypassing the collector
      - '4318'   # OTLP HTTP
    # Traces are the heaviest signal in the stack; give it more headroom than
    # Loki. Drop block_retention in tempo/tempo.yml if memory gets tight.
    mem_limit: 512M
    cpus: '0.5'
    logging:
      driver: "local"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - monitoring-network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets:
      - telegram_token
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://el-programmer.click/alertmanager
      - --web.route-prefix=/alertmanager
    labels:
      - traefik.enable=true
      - traefik.http.routers.alertmanager.rule=PathPrefix(`/alertmanager`)
      - traefik.http.routers.alertmanager.entrypoints=websecure
      - traefik.http.routers.alertmanager.tls=true
      - traefik.http.routers.alertmanager.tls.certresolver=le
      - traefik.http.routers.alertmanager.tls.domains[0].main=el-programmer.click
      - traefik.http.routers.alertmanager.priority=100
      - traefik.http.services.alertmanager.loadbalancer.server.port=9093
      - traefik.docker.network=monitoring-network
      # --- Subdomain route: alertmanager.el-programmer.click -> 301 to /alertmanager ---
      - traefik.http.routers.alertmanager-sub.rule=Host(`alertmanager.el-programmer.click`)
      - traefik.http.routers.alertmanager-sub.entrypoints=websecure
      - traefik.http.routers.alertmanager-sub.tls=true
      - traefik.http.routers.alertmanager-sub.tls.certresolver=le
      - traefik.http.routers.alertmanager-sub.service=alertmanager
      - traefik.http.routers.alertmanager-sub.middlewares=alertmanager-sub-redirect
      - traefik.http.middlewares.alertmanager-sub-redirect.redirectregex.regex=^https://alertmanager\.el-programmer\.click/?(.*)
      - traefik.http.middlewares.alertmanager-sub-redirect.redirectregex.replacement=https://el-programmer.click/alertmanager/$${1}
      - traefik.http.middlewares.alertmanager-sub-redirect.redirectregex.permanent=false
    mem_limit: 128M
    cpus: '0.25'
    networks:
      - monitoring-network
      - public-network

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alertmanager-data:
  tempo-data:

secrets:
  grafana_admin_password:
    file: ../secrets/grafana_admin_password
  telegram_token:
    file: ../secrets/telegram_token

networks:
  public-network:
    name: public-network
  monitoring-network:
    name: monitoring-network
    internal: true
