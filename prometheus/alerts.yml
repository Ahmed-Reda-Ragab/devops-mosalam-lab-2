# ############################################################################
#  ALERTING RULES  (task requirement 8: "Alerting on the Monitoring Layer")
#  Mapping of the required alerts -> the rule that implements each one:
#    1) API is slow ............. BackendHighLatencyP95  (+ BackendHighErrorRate)
#    2) DB usage is high ........ ContainerNearMemoryLimit / ContainerCPUThrottling
#                                 (they match every container incl. mysql-primary)
#    3) A container went down ... TargetDown (scraped services) + DatabaseDown /
#                                 FrontendDown / ReverseProxyDown / ContainerRestarting
#    4) Memory almost full ...... ContainerNearMemoryLimit + HostHighMemory
#    5) SSL about to expire ..... SSLCertificateExpiringSoon (via blackbox probe)
# ############################################################################
groups:
  # --- Availability ---
  # TargetDown covers everything Prometheus scrapes (prometheus, cadvisor,
  # node-exporter, backend, loki, promtail, grafana, alertmanager).
  # The three services that expose no metrics endpoint (db, frontend, nginx)
  # are watched at the container level via cAdvisor instead.
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Target {{ $labels.job }} is down'
          description: '{{ $labels.instance }} (job {{ $labels.job }}) has been unreachable for over 1 minute.'

      # cAdvisor stops reporting a container the moment it is gone, so absent()
      # over its compose-service label tells us the container is not running.
      #
      # The DB service name differs per topology: it is "db" in the legacy
      # single-file stack (docker-compose.yml) and "mysql-primary" in the split
      # database stack (compose/docker-compose.database.yml). We match BOTH with
      # a regex so this fires only when neither container exists — otherwise it
      # would false-positive permanently on whichever stack is not deployed.
      - alert: DatabaseDown
        expr: absent(container_last_seen{container_label_com_docker_compose_service=~"db|mysql-primary"})
        for: 2m
        labels:
          severity: critical
          service: db
        annotations:
          summary: 'Database (MySQL) container is down'
          description: 'cAdvisor has not seen the primary MySQL container for over 2 minutes — the database is not running.'

      - alert: FrontendDown
        expr: absent(container_last_seen{container_label_com_docker_compose_service="frontend"})
        for: 2m
        labels:
          severity: critical
          service: frontend
        annotations:
          summary: 'Frontend container is down'
          description: 'cAdvisor has not seen the frontend container for over 2 minutes — the site is not being served.'

      # Edge reverse proxy. The legacy stack fronted the site with "nginx";
      # the current stack uses "traefik". Match both so the rule stays correct
      # across topologies and never false-positives on the absent one. (Traefik
      # is also scraped, so its outage is caught by TargetDown too — this is the
      # belt-and-suspenders container-level check.)
      - alert: ReverseProxyDown
        expr: absent(container_last_seen{container_label_com_docker_compose_service=~"nginx|traefik"})
        for: 2m
        labels:
          severity: critical
          service: proxy
        annotations:
          summary: 'Edge reverse proxy (Traefik/Nginx) is down'
          description: 'cAdvisor has not seen the reverse-proxy container for over 2 minutes — the whole site is unreachable from outside.'

  # --- Containers (cAdvisor) ---
  - name: containers
    rules:
      - alert: ContainerNearMemoryLimit
        expr: container_memory_working_set_bytes{name=~".+"} / (container_spec_memory_limit_bytes{name=~".+"} > 0) > 0.9
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} near its memory limit'
          description: '{{ $labels.name }} is using {{ $value | humanizePercentage }} of its mem_limit (OOM risk).'

      - alert: ContainerOOMKilled
        expr: increase(container_oom_events_total{name=~".+"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} was OOM-killed'
          description: '{{ $labels.name }} hit its memory limit and was killed by the OOM killer in the last 10 minutes.'

      - alert: ContainerCPUThrottling
        expr: rate(container_cpu_cfs_throttled_periods_total{name=~".+"}[5m]) / rate(container_cpu_cfs_periods_total{name=~".+"}[5m]) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Container {{ $labels.name }} is CPU throttled'
          description: '{{ $labels.name }} is hitting its CPU limit ({{ $value | humanizePercentage }} of periods throttled).'

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{name=~".+"}[15m]) > 3
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: 'Container {{ $labels.name }} is crash-looping'
          description: '{{ $labels.name }} restarted more than 3 times in the last 15 minutes.'

  # --- Backend application (RED) ---
  - name: backend
    rules:
      - alert: BackendHighErrorRate
        expr: 100 * sum(rate(http_requests_total{job="backend",status=~"5.."}[5m])) / sum(rate(http_requests_total{job="backend"}[5m])) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Backend 5xx error rate is high'
          description: '5xx errors are {{ $value | printf "%.1f" }}% of requests over the last 5m.'

      - alert: BackendHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="backend"}[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Backend p95 latency is high'
          description: 'p95 latency is {{ $value | printf "%.2f" }}s over the last 5m.'

  # --- Host (node-exporter) ---
  - name: host
    rules:
      - alert: HostDiskAlmostFull
        expr: 100 * (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) < 15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Disk almost full on {{ $labels.mountpoint }}'
          description: 'Only {{ $value | printf "%.1f" }}% free on {{ $labels.mountpoint }} ({{ $labels.device }}).'

      # Trend-based: the disk is on a path to fill within 24h. Catches slow
      # leaks (logs, images) long before HostDiskAlmostFull would fire.
      - alert: HostDiskWillFillSoon
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[6h], 24 * 3600) < 0
          and
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: 'Disk on {{ $labels.mountpoint }} will fill within 24h'
          description: 'At the current growth rate {{ $labels.mountpoint }} ({{ $labels.device }}) is projected to run out of space in under 24 hours.'

      - alert: HostFilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|squashfs"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Filesystem {{ $labels.mountpoint }} is read-only'
          description: '{{ $labels.mountpoint }} ({{ $labels.device }}) has been mounted read-only — usually a sign of disk corruption or failure.'

      - alert: HostHighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High CPU usage on host'
          description: 'Host CPU usage is {{ $value | printf "%.1f" }}% over the last 5m.'

      - alert: HostHighMemory
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'High memory usage on host'
          description: 'Host memory usage is {{ $value | printf "%.1f" }}%.'

  # --- HTTPS / TLS ---
  # Fed by the blackbox exporter probing https://el-programmer.click (served the
  # real Let's Encrypt cert via Traefik). probe_ssl_earliest_cert_expiry is the
  # real CA cert's expiry, so SSLCertificateExpiringSoon gives genuine warning
  # ahead of a Let's Encrypt renewal failure.
  - name: tls
    rules:
      - alert: HTTPSProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'HTTPS probe failed for {{ $labels.instance }}'
          description: 'The HTTPS probe for {{ $labels.instance }} has failed for over 2 minutes.'

      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 7 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'TLS certificate expires soon for {{ $labels.instance }}'
          description: 'The TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }} (approximately {{ (($value / 86400) | printf "%.1f") }} days).'
          value: '{{ (probe_ssl_earliest_cert_expiry - time()) }}'

      # Additional alert for when certificate is expiring very soon (within 2 days)
      - alert: SSLCertificateExpiringSoonCritical
        expr: probe_ssl_earliest_cert_expiry - time() < 2 * 24 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: '🚨 TLS certificate expires VERY SOON for {{ $labels.instance }}'
          description: 'URGENT: The TLS certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }} (approximately {{ (($value / 86400) | printf "%.1f") }} days). Action required!'
          value: '{{ (probe_ssl_earliest_cert_expiry - time()) }}'

      # Informational alert showing current days remaining (always active for monitoring)
      - alert: SSLCertificateExpiryInfo
        expr: probe_ssl_earliest_cert_expiry > 0
        for: 1m
        labels:
          severity: info
        annotations:
          summary: 'SSL Certificate Status: {{ $labels.instance }}'
          description: 'Certificate for {{ $labels.instance }} is valid. Days remaining: {{ (($value - time()) / 86400) | printf "%.0f" }} days. Expires on {{ $value | humanizeTimestamp }}.'
          value: '{{ (probe_ssl_earliest_cert_expiry - time()) }}'

  # --- Monitoring self-health ---
  # These make sure the alerting pipeline itself is healthy. If Prometheus can't
  # reach Alertmanager, or Alertmanager can't deliver to Telegram, you'd
  # otherwise get silence — which looks exactly like "everything is fine".
  - name: monitoring
    rules:
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: 'Prometheus config reload failed'
          description: 'The last reload of prometheus.yml failed — check the config syntax.'

      - alert: PrometheusNotConnectedToAlertmanager
        expr: prometheus_notifications_alertmanagers_discovered < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus is not connected to any Alertmanager'
          description: 'Prometheus has 0 Alertmanagers configured/discovered — no alert would ever be delivered.'

      - alert: PrometheusAlertDeliveryFailing
        expr: rate(prometheus_notifications_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Prometheus is failing to send alerts to Alertmanager'
          description: 'Prometheus has been getting errors while pushing alerts to Alertmanager for over 5 minutes.'

      - alert: AlertmanagerNotificationFailing
        expr: rate(alertmanager_notifications_failed_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Alertmanager is failing to deliver notifications'
          description: 'Alertmanager could not deliver notifications via {{ $labels.integration }} (e.g. Telegram) — check the bot token, chat_id and network egress.'
