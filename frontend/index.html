<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Task Manager</h1>
    <section class="form-panel">
      <h2 id="form-title">Create Task</h2>
      <form id="task-form">
        <label>
          Name
          <input type="text" id="task-name" name="name" required />
        </label>
        <label>
          Description
          <textarea id="task-description" name="description" rows="3"></textarea>
        </label>
        <label>
          Status
          <select id="task-status" name="status">
            <option value="pending">pending</option>
            <option value="completed">completed</option>
          </select>
        </label>
        <div class="buttons">
          <button type="submit">Save</button>
          <button type="button" id="cancel-update" class="secondary hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="list-panel">
      <div class="toolbar">
        <h2>Tasks</h2>
        <p class="hint">Backend: <span id="backend-url"></span></p>
      </div>
      <div id="error-message" class="error hidden"></div>
      <ul id="task-list"></ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
