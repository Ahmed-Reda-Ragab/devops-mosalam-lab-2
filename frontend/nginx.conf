server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
